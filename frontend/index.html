
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <p>Manage student records in one place</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add New Student</h2>

      <form id="student-form">
        <input type="hidden" id="student-db-id">

        <label for="studentId">Student ID</label>
        <input id="studentId" required placeholder="e.g. STU101">

        <label for="name">Full Name</label>
        <input id="name" required placeholder="Enter student name">

        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="Enter email">

        <label for="course">Course</label>
        <input id="course" required placeholder="e.g. BCA">

        <label for="semester">Semester</label>
        <select id="semester" required>
          <option value="">Select semester</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
          <option value="7">Semester 7</option>
          <option value="8">Semester 8</option>
        </select>

        <button type="submit" id="submit-btn">Add Student</button>
        <button type="button" id="cancel-btn" hidden>Cancel Edit</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Student Records</h2>
      <input id="search" placeholder="Search by ID, name, email or course">
      <p id="student-count">Loading students...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Course</th>
              <th>Semester</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
